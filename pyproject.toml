[project]
name = "pneumonia-x"
version = "0.1.0"
description = "Chest X-ray pneumonia detection: patient-level evaluation, external validation, explainability and deployment"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
